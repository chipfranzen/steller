meta:
  engine: 4.1.0
units:
  # proxy spacing variables
  # choc switches
  kx: cx
  ky: cy
  # padding variables
  px: kx + 2
  py: ky + 2
  # render choc switches in the preview
  $default_width: cx
  $default_height: cy

points:
  zones:
    matrix:
      anchor:
        shift: [100, -100]
      key:
        padding: 1py
        spread: 1py
      columns:
        outer:
          key:
            column_net: P5
          rows:
            bottom:
              skip: true
            home:
              row_net: P15
            top:
              skip: true
        pinky:
          key:
            stagger: 0.3kx
            splay: -5
            spread: 1.01py
            column_net: P5
          rows:
            bottom:
            home:
            top:
              skip: true
        ring:
          key:
            stagger: 0.7kx
            splay: -5
            spread: 1.05py
            column_net: P6
        middle:
          key:
            stagger: 0.35kx
            column_net: P9
        index:
          key:
            stagger: -0.40kx
            column_net: P8
        inner:
          key:
            stagger: -0.15kx
            column_net: P7
      rows:
        bottom:
          row_net: P16
        home:
          row_net: P14
        top:
          row_net: P15
    thumbs:
      anchor:
        shift: [5.45px, -4.45px]
        rotate: -10
      key:
        padding: 1py
      columns:
        home:
          key:
            column_net: P5
        inner:
          key:
            splay: -10
            spread: 1.15px
            stagger: 0.55kx
            column_net: P6
        outer:
          key:
            splay: -10
            spread: 1.15px
            stagger: 0.55kx
            column_net: P9
      rows:
        cluster:
          row_net: P10
          shift: [4.1ky, -0.65ky]

outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx, ky]
  kb2040:
    - what: rectangle
      size: [17.8, 35.0]
      adjust:
        shift: [4.8px, 2.05py]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_home
          shift: [-0.5px, 0.5px]
        - ref: matrix_pinky_home
          shift: [-0.5px, 0.5px]
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5px]
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5px]
        - ref: matrix_middle_top
          shift: [0.5px, 0.5px]
        - ref: matrix_index_top
          shift: [0.5px, 0.5px]
        - ref: matrix_inner_top
          shift: [0.5px, 0.5px]
        - ref: matrix_inner_top
          shift: [1.45px, .85px]
        - ref: thumbs_outer_cluster
          shift: [.43px, 2.1px]
        - ref: thumbs_outer_cluster
          shift: [0.5px, 0.5px]
        - ref: thumbs_outer_cluster
          shift: [0.5px, -0.5px]
        - ref: thumbs_outer_cluster
          shift: [-0.5px, -0.5px]
        - ref: thumbs_inner_cluster
          shift: [-0.5px, -0.5px]
        - ref: thumbs_home_cluster
          shift: [-0.5px, -0.5px]
        - ref: matrix_pinky_bottom
          shift: [-0.5px, -0.5px]
        - ref: matrix_outer_home
          shift: [-0.5px, -0.5px]
      fillet: 2
  combo:
    - name: board
    - operation: subtract
      name: keys
    - operation: subtract
      name: kb2040

pcbs:
  steller:
    outlines:
      main:
        outline: board
    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      promicro:
        what: promicro
        params:
          orientation: "up"
        where:
          ref.aggregate.parts: [thumbs_outer_cluster, matrix_inner_top]
          shift: [.5px, 1.5px]
          rotate: -60
      trrs:
        what: trrs_pj320a
        params:
          reversible: true
          SL: GND
          R2: P1
          R1: VCC
          TP: GND
        where:
          ref.aggregate.parts: [thumbs_outer_cluster, matrix_inner_top]
          shift: [1.45px, .7px]
          rotate: -60
